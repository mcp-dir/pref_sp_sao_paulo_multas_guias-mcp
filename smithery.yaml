# Smithery configuration for Prefeitura SP São Paulo: Multas
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_pref_sp_sao_paulo_multas_guias

name: pref_sp_sao_paulo_multas_guias-mcp
displayName: "Prefeitura SP São Paulo: Multas"
description: >
  Prefeitura SP São Paulo: Multas, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/pref_sp_sao_paulo_multas_guias-mcp
repository: https://github.com/mcp-dir/pref_sp_sao_paulo_multas_guias-mcp

tags:
  - pref_sp_sao_paulo_multas_guias
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_pref_sp_sao_paulo_multas_guias

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_pref_sp_sao_paulo_multas_guias/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
